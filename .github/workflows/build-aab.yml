name: Build Android AAB
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
 
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
 
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
 
      - name: Instalar dependências
        run: npm install
 
      - name: Criar pasta www e copiar arquivos
        run: |
          mkdir -p www/assets
          cp index.html www/
          if [ -d assets ]; then
            cp -r assets/* www/assets/
          fi
          cp *.png www/assets/ 2>/dev/null || true
          cp *.jpg www/assets/ 2>/dev/null || true
          cp *.jpeg www/assets/ 2>/dev/null || true
          cp *.mp3 www/assets/ 2>/dev/null || true
          cp *.wav www/assets/ 2>/dev/null || true
          echo "Arquivos copiados pra www/assets:"
          ls -la www/assets/
 
      - name: Adicionar plataforma Android
        run: npx cap add android || true
 
      - name: Sync Capacitor
        run: npx cap sync android
 
      - name: Adicionar App ID AdMob no Manifesto
        run: |
          python3 << 'PYEOF2'
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              content = f.read()
          admob_tag = '    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-6853379352980306~6304076120"/>'
          if 'APPLICATION_ID' not in content:
              content = content.replace('</application>', admob_tag + '\n    </application>')
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(content)
          print("App ID AdMob adicionado com sucesso!")
          PYEOF2
 
      - name: Gravar ícones do app (embutidos direto no workflow)
        run: |
          python3 << 'PYEOF3'
          import base64, os
          icons = {
              "mdpi": "",
              "hdpi": "",
              "xhdpi": "",
              "xxhdpi": "",
              "xxxhdpi": "",
          }
 
          for density, b64data in icons.items():
              folder = f'android/app/src/main/res/mipmap-{density}'
              os.makedirs(folder, exist_ok=True)
              raw = base64.b64decode(b64data)
              with open(f'{folder}/ic_launcher.png', 'wb') as f:
                  f.write(raw)
              with open(f'{folder}/ic_launcher_round.png', 'wb') as f:
                  f.write(raw)
              print(f'Ícone {density} gravado: {len(raw)} bytes')
 
          PYEOF3
 
      - name: Forçar ícones PNG (remove adaptive icon vetorial)
        run: rm -rf android/app/src/main/res/mipmap-anydpi-v26
 
      - name: Atualizar versionCode (sempre crescente, exigido pela Play Store)
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $(date +%s)/g" android/app/build.gradle
 
      - name: Tornar gradlew executável
        run: chmod +x android/gradlew
 
      - name: Build AAB (Release)
        run: |
          cd android
          ./gradlew bundleRelease
 
      - name: Assinar AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
 
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: tower-of-bones-release
          path: ${{ steps.sign_aab.outputs.signedReleaseFile }}
 











